<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Signal Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Signal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0a0d14;--bg2:#0f1320;--card:#141a29;--card2:#1a2133;--line:#232b40;--tx:#eef1f7;--mut:#8b94a8;--mut2:#5d6579;--up:#1fd286;--upbg:rgba(31,210,134,.12);--dn:#ff4d6a;--dnbg:rgba(255,77,106,.12);--acc:#8b6cff;--accbg:rgba(139,108,255,.14);--amb:#ffb547;--ambbg:rgba(255,181,71,.13);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(1200px 500px at 50% -200px,#1b1640 0%,var(--bg) 60%) fixed}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8b6cff,#1fd286);display:grid;place-items:center;font-weight:800;color:#0a0d14;font-size:18px}
.bt{font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:3px}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.live{color:var(--up);background:var(--upbg)}.pill.demo{color:var(--amb);background:var(--ambbg)}.pill.load{color:var(--mut);background:var(--card)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bankbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:600}
.kpi .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;margin-top:3px}
.bar{height:5px;background:var(--bg2);border-radius:9px;margin-top:7px;overflow:hidden}.bar b{display:block;height:100%;border-radius:9px;background:var(--up)}
.banner{border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px;line-height:1.4}
.banner.red{background:var(--dnbg);color:#ff8fa2;border:1px solid rgba(255,77,106,.3)}
.banner.green{background:var(--upbg);color:#6ff0b6;border:1px solid rgba(31,210,134,.3)}
.banner.amb{background:var(--ambbg);color:#ffd08a;border:1px solid rgba(255,181,71,.3)}
.banner.acc{background:var(--accbg);color:#c6b8ff;border:1px solid rgba(139,108,255,.3)}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-family:Unbounded,sans-serif;font-size:17px;font-weight:700;margin:6px 2px 4px}
.sub{color:var(--mut);font-size:13px;margin:0 2px 12px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.coin{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.cic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.cn{flex:1;min-width:0}.cn b{font-size:15px}.cn small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{text-align:right;min-width:92px}.cp .p{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:600}.cp .c{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mut)}
.sig{width:86px;flex:none;text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;letter-spacing:.3px}
.badge.L{background:var(--upbg);color:var(--up)}.badge.S{background:var(--dnbg);color:var(--dn)}.badge.W{background:var(--card2);color:var(--mut)}
.cbar{height:4px;border-radius:9px;background:var(--bg2);margin-top:6px;overflow:hidden}.cbar b{display:block;height:100%}
.cf{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);margin-top:3px}
.hero{display:flex;align-items:center;gap:14px}
.ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-family:'JetBrains Mono',monospace;font-size:18px;display:block}.ring small{font-size:9.5px;color:var(--mut);font-weight:700}
.dirt{font-family:Unbounded,sans-serif;font-size:20px;font-weight:700}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.lbl{font-size:12px;color:var(--mut);font-weight:700;margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:10px 11px;position:relative}
.cell .l{font-size:11.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.cell .v{font-family:'JetBrains Mono',monospace;font-size:15.5px;font-weight:700;margin-top:4px;word-break:break-all}
.cell .s{font-size:11.5px;margin-top:2px;font-weight:600}
.q{width:17px;height:17px;border-radius:50%;background:var(--card2);color:var(--mut);font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;flex:none}
.cell.full{grid-column:1/-1}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;background:var(--acc);color:#fff;margin-top:10px}
.btn.g{background:var(--up);color:#062a19}.btn.r{background:var(--dn)}.btn.o{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:10px;font-size:13px;margin-top:0;border-radius:11px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 36px;font-size:14px;line-height:1.45;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:8px;background:var(--accbg);color:#c6b8ff;font-weight:800;font-size:12px;display:grid;place-items:center}
.steps b{font-family:'JetBrains Mono',monospace;font-weight:700}
.ind{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ind:last-child{border:0}
.ind .dot{width:30px;height:22px;border-radius:7px;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.ind .t b{font-size:13.5px}.ind .t small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4;margin-top:2px}
.ind .val{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);white-space:nowrap;padding-left:6px}
#chartBox{height:360px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;margin-bottom:12px;position:relative}
.tr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
.trh{display:flex;align-items:center;gap:9px}
.trh .m{margin-left:auto;text-align:right}
.trg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.trg div{font-size:11px;color:var(--mut)}.trg b{display:block;font-family:'JetBrains Mono',monospace;color:var(--tx);font-size:12px;margin-top:2px;font-weight:600;word-break:break-all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(10,13,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mut2)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--tx)}.tabs button.on svg{stroke:var(--acc)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:8px 18px 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:Unbounded,sans-serif;font-size:16px;margin:4px 0 10px}
.sheet p{color:#c9cfdb;line-height:1.55;font-size:14.5px;margin:0 0 10px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.fld small{display:block;color:var(--mut);font-size:12px;margin-top:5px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700}
canvas{display:block;width:100%}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px;line-height:1.5}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.list-tight p{margin:0 0 6px}
.toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:30;background:var(--card2);border:1px solid rgba(139,108,255,.5);border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s ease;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
button[disabled]{opacity:.55}
input[type=file]{font-size:13px;padding:10px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo">◆</div><div><div class="bt">Signal Desk</div><div id="dataPill" class="pill load"><i></i>Підключення…</div></div></div>
    <button class="icon" data-act="settings" aria-label="Налаштування">⚙</button>
  </header>
  <section id="bankbar"></section>
  <main>
    <section class="view on" id="v-signals"></section>
    <section class="view" id="v-trade"></section>
    <section class="view" id="v-chart">
      <div class="row" style="margin-bottom:10px"><select id="chartSym" data-chg="chartSym" style="flex:1"></select></div>
      <div class="chips" id="tfChips"></div>
      <div id="chartBox"></div>
      <div id="chartInd"></div>
    </section>
    <section class="view" id="v-journal"></section>
    <section class="view" id="v-stats"></section>
  </main>
</div>
<nav class="tabs"><div>
  <button class="on" data-act="tab" data-arg="signals"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Сигнали</button>
  <button data-act="tab" data-arg="trade"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Угода</button>
  <button data-act="tab" data-arg="chart"><svg viewBox="0 0 24 24"><path d="M6 4v16M6 8h-2v6h4V8H6zM12 6v14M10 9h4v6h-4zM18 3v14M16 6h4v7h-4z"/></svg>Графік</button>
  <button data-act="tab" data-arg="journal"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>Журнал</button>
  <button data-act="tab" data-arg="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script>
/* ================== ДАНІ ТА НАЛАШТУВАННЯ ================== */
const COINS=[['BTC','Bitcoin',95000],['ETH','Ethereum',3300],['BNB','BNB',900],['SOL','Solana',180],['XRP','XRP',2.3],['DOGE','Dogecoin',0.2],['ADA','Cardano',0.7],['TRX','TRON',0.3],['AVAX','Avalanche',25],['LINK','Chainlink',18],['TON','Toncoin',3],['DOT','Polkadot',4],['SUI','Sui',3.2],['LTC','Litecoin',100],['BCH','Bitcoin Cash',500],['NEAR','NEAR Protocol',2.8],['APT','Aptos',5],['UNI','Uniswap',9],['ICP','Internet Computer',5],['XLM','Stellar',0.35],['ETC','Ethereum Classic',18],['HBAR','Hedera',0.22],['FIL','Filecoin',2.8],['ATOM','Cosmos',4.5],['ARB','Arbitrum',0.4],['OP','Optimism',0.7],['INJ','Injective',13],['AAVE','Aave',280],['PEPE','Pepe',0.00001],['SHIB','Shiba Inu',0.000013]]
.map(([s,n,p])=>({s,n,p,vol:s==='BTC'?.0018:['ETH','BNB','TRX','LTC','BCH','XLM'].includes(s)?.0025:['PEPE','SHIB','DOGE','INJ','SUI','APT','ARB','OP'].includes(s)?.0045:.0035}));
const CM=Object.fromEntries(COINS.map(c=>[c.s,c]));
const DEF={bank:250,goal:20,risk:2,maxLev:10,marginPct:25,mode:'futures',feeMaker:0.02,feeTaker:0.05,feeSpot:0.1,dailyLoss:6,maxTrades:4,minConf:65,onboarded:false,bankSetAt:Date.now(),style:'calm',tpMode:'one'};
const STYLES={calm:{main:'1h',high:'4h',expiry:4,expTxt:'4 години',hold:72,name:'Спокійний',lbl:'1 год'},active:{main:'15m',high:'1h',expiry:4,expTxt:'1 годину',hold:96,name:'Активний',lbl:'15 хв'}};
const ST=()=>STYLES[S.style]||STYLES.calm;
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}cloudPush()}
/* Хмарне збереження в артефакті Claude: налаштування і журнал прив'язані до твого акаунта.
   У PWA (поза Claude) достатньо localStorage телефона. */
let CLOUD=null,pushT=null,pushing=false,dirty=false;
const clone=o=>JSON.parse(JSON.stringify(o));
function cloudPush(){if(!CLOUD)return;clearTimeout(pushT);pushT=setTimeout(doPush,1200)}
async function doPush(){if(pushing){dirty=true;return}pushing=true;try{await CLOUD.set({S:clone(S),J:clone(J),at:Date.now()})}catch(e){}pushing=false;if(dirty){dirty=false;doPush()}}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/state'),snap=await withTimeout(ref.get(),10000);if(!snap)return;
    CLOUD=ref;
    if(snap.exists){const d=snap.data()||{};if(d.S)Object.assign(S,clone(d.S));if(Array.isArray(d.J))J=clone(d.J);
      try{localStorage.setItem('sd_settings',JSON.stringify(S));localStorage.setItem('sd_journal',JSON.stringify(J))}catch(e){}}
    else if(S.onboarded||J.length)doPush();
  }catch(e){}
}
const S=Object.assign({},DEF,load('sd_settings',{}));
let J=load('sd_journal',[]);
const st={view:'signals',filter:'all',sel:'BTC',override:null,entryType:'limit',mode:S.mode,sig:{},P:{},src:'load',tick:0,chartSym:'BTC',chartTf:ST().main,prevStrong:null,bt:null,btRun:false,statTab:'mine',showPlan:true,closing:null,confirmClear:false};
const TF={'5m':300,'15m':900,'1h':3600,'4h':14400};

/* ================== ФОРМАТУВАННЯ ================== */
function dec(p){return p>=1000?2:p>=10?3:p>=1?4:p>=0.01?5:8}
function fp(p){if(p==null||!isFinite(p))return '—';if(p<0.01)return p.toPrecision(4);return p.toLocaleString('en-US',{minimumFractionDigits:dec(p),maximumFractionDigits:dec(p)})}
function fu(x,sign){if(x==null||!isFinite(x))return '—';const s=sign?(x>0?'+':x<0?'−':''):(x<0?'−':'');return s+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fq(q){return q>=100?Math.round(q).toLocaleString('en-US'):q>=1?q.toFixed(2):q.toFixed(4)}
function pct(x,d=2){return (x>0?'+':'')+x.toFixed(d)+'%'}
function hue(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
function cic(s){const h=hue(s);return `<div class="cic" style="background:hsla(${h},70%,60%,.16);color:hsl(${h},80%,72%)">${s.slice(0,4)}</div>`}
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};

/* ================== ДЕМО-ДВИГУН ================== */
const D={};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function demoCandle(o,c,p){
  if(o.regime<=0){o.drift=(Math.random()-.5)*.5*c.vol;o.regime=80+Math.random()*300}
  o.regime--;let cur=p,hi=p,lo=p;
  for(let j=0;j<6;j++){cur*=1+o.drift/6+gauss()*c.vol/Math.sqrt(6);hi=Math.max(hi,cur);lo=Math.min(lo,cur)}
  return {o:p,h:hi,l:lo,c:cur,v:(1+Math.abs(gauss()))*1000*(1+Math.abs(cur-p)/p/c.vol)};
}
function demoInit(){
  const now=Math.floor(Date.now()/1000),start=Math.floor(now/14400)*14400-6000*300;
  COINS.forEach(c=>{
    const o={base:[],drift:0,regime:0,sub:0};let p=c.p,t=start;
    for(let i=0;i<6000;i++){const k=demoCandle(o,c,p);k.t=t;o.base.push(k);p=k.c;t+=300}
    const f=c.p/p;o.base.forEach(b=>{b.o*=f;b.h*=f;b.l*=f;b.c*=f});D[c.s]=o;
  });
  updDemoP();
}
function demoTick(){
  COINS.forEach(c=>{
    const o=D[c.s],b=o.base,last=b[b.length-1];
    const cur=last.c*(1+o.drift/20+gauss()*c.vol/Math.sqrt(20));
    last.c=cur;last.h=Math.max(last.h,cur);last.l=Math.min(last.l,cur);last.v+=Math.abs(gauss())*60;
    if(++o.sub>=20){o.sub=0;o.regime--;if(o.regime<=0){o.drift=(Math.random()-.5)*.5*c.vol;o.regime=80+Math.random()*300}
      b.push({t:last.t+300,o:cur,h:cur,l:cur,c:cur,v:0});if(b.length>6500)b.splice(0,48)}
  });updDemoP();
}

/* ================== ІНДИКАТОРИ ================== */
function emaA(v,n){const k=2/(n+1),o=[];let e=v[0];for(let i=0;i<v.length;i++){e=i?v[i]*k+e*(1-k):v[0];o.push(e)}return o}
function smaA(v,n){const o=[];let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=n)s-=v[i-n];o.push(i>=n-1?s/n:null)}return o}
function rsiA(c,n=14){const o=Array(c.length).fill(null);if(c.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;o[n]=l===0?100:100-100/(1+g/l);
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l===0?100:100-100/(1+g/l)}return o}
function trA(k){return k.map((b,i)=>i?Math.max(b.h-b.l,Math.abs(b.h-k[i-1].c),Math.abs(b.l-k[i-1].c)):b.h-b.l)}
function atrA(k,n=14){const tr=trA(k),o=Array(k.length).fill(null);let a=0;for(let i=0;i<k.length;i++){if(i<n){a+=tr[i];if(i===n-1){a/=n;o[i]=a}}else{a=(a*(n-1)+tr[i])/n;o[i]=a}}return o}
function adxA(k,n=14){const len=k.length,tr=trA(k),pdm=[0],mdm=[0];
  for(let i=1;i<len;i++){const up=k[i].h-k[i-1].h,dn=k[i-1].l-k[i].l;pdm.push(up>dn&&up>0?up:0);mdm.push(dn>up&&dn>0?dn:0)}
  let sT=0,sP=0,sM=0;const pdi=[],mdi=[],dx=[];
  for(let i=1;i<len;i++){if(i<=n){sT+=tr[i];sP+=pdm[i];sM+=mdm[i]}else{sT=sT-sT/n+tr[i];sP=sP-sP/n+pdm[i];sM=sM-sM/n+mdm[i]}
    if(i>=n){const p=100*sP/(sT||1),m=100*sM/(sT||1);pdi[i]=p;mdi[i]=m;dx[i]=100*Math.abs(p-m)/((p+m)||1)}}
  const adx=Array(len).fill(null);let a=0,cnt=0;for(let i=n;i<len;i++){if(cnt<n){a+=dx[i];cnt++;if(cnt===n){a/=n;adx[i]=a}}else{a=(a*(n-1)+dx[i])/n;adx[i]=a}}
  return {adx,pdi,mdi}}
function macdA(c){const a=emaA(c,12),b=emaA(c,26),m=c.map((_,i)=>a[i]-b[i]),s=emaA(m,9);return {m,s,h:m.map((x,i)=>x-s[i])}}
function bbA(c,n=20,k=2){const mid=smaA(c,n),up=[],lo=[];for(let i=0;i<c.length;i++){if(mid[i]==null){up.push(null);lo.push(null);continue}let s=0;for(let j=i-n+1;j<=i;j++)s+=(c[j]-mid[i])**2;const sd=Math.sqrt(s/n);up.push(mid[i]+k*sd);lo.push(mid[i]-k*sd)}return {mid,up,lo}}
function sma3(a){return a.map((x,i)=>i<2||a[i]==null||a[i-1]==null||a[i-2]==null?null:(a[i]+a[i-1]+a[i-2])/3)}
function stochRsiA(c){const r=rsiA(c,14);const s=r.map((x,i)=>{if(i<27||x==null)return null;let mn=1e18,mx=-1e18;for(let j=i-13;j<=i;j++){mn=Math.min(mn,r[j]);mx=Math.max(mx,r[j])}return mx===mn?50:100*(x-mn)/(mx-mn)});const K=sma3(s);return {k:K,d:sma3(K)}}
function superA(k,n=10,m=3){const at=atrA(k,n),dir=Array(k.length).fill(1),line=Array(k.length).fill(null);let fu=0,fl=0,init=false;
  for(let i=0;i<k.length;i++){if(at[i]==null)continue;const hl=(k[i].h+k[i].l)/2,bu=hl+m*at[i],bl=hl-m*at[i];
    if(!init){fu=bu;fl=bl;init=true}else{fu=(bu<fu||k[i-1].c>fu)?bu:fu;fl=(bl>fl||k[i-1].c<fl)?bl:fl;dir[i]=dir[i-1];if(dir[i]===1&&k[i].c<fl)dir[i]=-1;else if(dir[i]===-1&&k[i].c>fu)dir[i]=1}
    line[i]=dir[i]===1?fl:fu}return {dir,line}}

/* ================== АНАЛІЗ: 10 ІНДИКАТОРІВ → ВПЕВНЕНІСТЬ ================== */
function indic(k){const c=k.map(b=>b.c);let ob=0;const obs=[0];for(let i=1;i<k.length;i++){ob+=c[i]>c[i-1]?k[i].v:c[i]<c[i-1]?-k[i].v:0;obs.push(ob)}
  return {k,c,e9:emaA(c,9),e21:emaA(c,21),e200:emaA(c,200),rsi:rsiA(c),md:macdA(c),bb:bbA(c),sr:stochRsiA(c),su:superA(k),ad:adxA(k),atr:atrA(k),obs}}
function hIndic(h){const c=h.map(b=>b.c);return {c,e21:emaA(c,21),e50:emaA(c,50)}}
function analyze(sym){const s=ST(),k=getCandles(sym,s.main),h=getCandles(sym,s.high);if(!k||k.length<210||!h||h.length<60)return null;return scoreAt(indic(k),hIndic(h),k.length-1,h.length-1,sym)}
function scoreAt(I,HI,last,hl,sym){

  const pb=(price-bb.lo[last])/((bb.up[last]-bb.lo[last])||1),K=sr.k[last],Dd=sr.d[last];
  const ADX=ad.adx[last],PDI=ad.pdi[last],MDI=ad.mdi[last],atr=I.atr[last];
  const hc=HI.c,he21=HI.e21,he50=HI.e50;
  const obS=obs[last]-obs[last-20];let va=0;for(let i=last-21;i<last-1;i++)va+=k[i].v;va/=20;const vr=k[last-1].v/(va||1);
  const ind=[],add=(name,val,vote,w,txt)=>ind.push({name,val,vote,w,txt});
  add('Довгий тренд (EMA200)',fp(e200[last]),price>e200[last]?1:-1,1.5,price>e200[last]?'Ціна вище довгої середньої: загальний рух вгору':'Ціна нижче довгої середньої: загальний рух вниз');

  const hv=hc[hl]>he50[hl]&&he21[hl]>he50[hl]?1:hc[hl]<he50[hl]&&he21[hl]<he50[hl]?-1:0;
  add('Старший графік ('+ST().high+')',hv>0?'вгору':hv<0?'вниз':'боковик',hv,1.5,hv>0?'На старшому графіку тренд вгору: вітер у спину для лонгу':hv<0?'На старшому графіку тренд вниз: вітер у спину для шорту':'Старший графік без чіткого напрямку');
  const mv=hist>0?(hist>histP?1:.3):(hist<histP?-1:-.3);

  const rv=r<30?1:r>70?-1:r>=50?.5:-.5;
  add('RSI',r.toFixed(0),rv,1,r<30?'Перепродано: часто буває відскок вгору':r>70?'Перекуплено: часто буває відкат вниз':r>=50?'Покупці трохи сильніші':'Продавці трохи сильніші');
  const sv=K!=null&&Dd!=null?(K<20&&K>Dd?1:K>80&&K<Dd?-1:0):0;
  add('Stoch RSI',K!=null?K.toFixed(0):'—',sv,.7,sv>0?'Розворот вгору із зони перепроданості':sv<0?'Розворот вниз із зони перекупленості':'Нейтрально, сигналу немає');
  const bv=pb<.15?.7:pb>.85?-.7:0;
  add('Смуги Боллінджера',(pb*100).toFixed(0)+'%',bv,.7,bv>0?'Ціна біля нижньої межі: часто відштовхується вгору':bv<0?'Ціна біля верхньої межі: часто відштовхується вниз':'Ціна в середині каналу');
  add('Supertrend',su.dir[last]>0?'вгору':'вниз',su.dir[last],1.2,su.dir[last]>0?'Трендовий індикатор показує ріст':'Трендовий індикатор показує падіння');
  const av=ADX>=25?Math.sign(PDI-MDI):ADX>=18?.5*Math.sign(PDI-MDI):0;
  add('Сила тренду (ADX)',ADX.toFixed(0),av,1,ADX<18?'Тренду майже немає (боковик): сигнали ненадійні':ADX>=25?'Сильний рух '+(PDI>MDI?'вгору':'вниз'):'Помірний рух '+(PDI>MDI?'вгору':'вниз'));
  const ov=Math.sign(obS)*(vr>1.2?1:.5);
  add('Обсяги (OBV)','×'+vr.toFixed(1),ov,.8,(obS>0?'Гроші заходять у монету':'Гроші виходять з монети')+(vr>1.2?', обсяг вище середнього':''));
  let sw=0,sv2=0;ind.forEach(i=>{sw+=i.w;sv2+=i.vote*i.w});const score=sv2/sw;

  if(dir===1&&r>75){conf*=.8;notes.push('RSI дуже високий: ризик купити на вершині.')}

/* ================== ПЛАН УГОДИ ================== */
function feesFor(m){return m==='spot'?{mk:S.feeSpot/100,tk:S.feeSpot/100}:{mk:S.feeMaker/100,tk:S.feeTaker/100}}
function closedT(){return J.filter(t=>t.status!=='open')}
function bankNow(){return S.bank+closedT().filter(t=>t.closedAt>S.bankSetAt).reduce((s,t)=>s+t.pnl,0)}
function today(){const k=dayKey(Date.now());const c=closedT().filter(t=>dayKey(t.closedAt)===k);const o=J.filter(t=>dayKey(t.openedAt)===k);
  let streak=0;for(const t of c.slice().sort((a,b)=>b.closedAt-a.closedAt)){if(t.pnl<0)streak++;else break}
  return {pnl:c.reduce((s,t)=>s+t.pnl,0),count:o.length,lossStreak:streak}}
function makePlan(a,dir,entryType,mode,bankIn,tpModeIn){const one=(tpModeIn||S.tpMode)==='one';
  const f=feesFor(mode),fe=entryType==='market'?f.tk:f.mk,price=a.price,atr=a.atr;let entry;
  if(entryType==='market')entry=price;
  else if(dir===1)entry=(a.e21<price&&a.e21>price-1.2*atr)?a.e21:price-.3*atr;
  else entry=(a.e21>price&&a.e21<price+1.2*atr)?a.e21:price+.3*atr;
  let dist=dir===1?entry-(a.swLo-.25*atr):(a.swHi+.25*atr)-entry;dist=Math.min(Math.max(dist,atr),2.5*atr);
  const sl=entry-dir*dist,tp1=entry+dir*(one?2:1.5)*dist,tp2=entry+dir*(one?2:2.5)*dist,bank=bankIn||bankNow(),riskUsd=bank*S.risk/100;
  let qty=riskUsd/(dist+entry*fe+sl*f.tk),lev=1;const notes=[];
  if(mode==='spot'){const cap=bank*.95;if(qty*entry>cap){qty=cap/entry;notes.push('Розмір обмежено банком, тому ризик менший за плановий.')}}
  else{const mc=bank*S.marginPct/100;lev=Math.max(1,Math.ceil(qty*entry/mc));if(lev>S.maxLev){lev=S.maxLev;qty=lev*mc/entry;notes.push(`Плече обмежено до ${S.maxLev}x, тому позиція і ризик менші за плановий.`)}}
  const notional=qty*entry,margin=notional/lev,liq=mode==='spot'?null:(dir===1?entry*(1-1/lev+.005):entry*(1+1/lev-.005)),feeIn=notional*fe;
  const pnlSL=-qty*dist-feeIn-qty*sl*f.tk,pnlTP=qty/2*(tp1-entry)*dir+qty/2*(tp2-entry)*dir-feeIn-qty/2*tp1*f.mk-qty/2*tp2*f.mk,pnlBE=one?null:qty/2*(tp1-entry)*dir-feeIn-qty/2*tp1*f.mk-qty/2*entry*f.tk;
  if(liq!=null&&(dir===1?liq>=sl:liq<=sl))notes.push('⚠️ Ліквідація ближче за стоп! Зменш плече.');
  return {tpMode:one?'one':'two',sym:a.sym,dir,mode,entryType,entry,sl,tp1,tp2,dist,qty,lev,notional,margin,liq,feeIn,feeTP:feeIn+qty/2*tp1*f.mk+qty/2*tp2*f.mk,riskUsd:-pnlSL,pnlSL,pnlTP,pnlBE,notes,conf:a.conf,distPct:dist/entry*100,fmk:f.mk,ftk:f.tk};
}

function sigBadge(a){if(!a)return '<span class="badge W">…</span>';return a.dir>0?'<span class="badge L">↑ ЛОНГ</span>':a.dir<0?'<span class="badge S">↓ ШОРТ</span>':'<span class="badge W">ЧЕКАТИ</span>'}
function confColor(c){return c>=75?'var(--up)':c>=S.minConf?'var(--amb)':'var(--mut2)'}
function renderSignals(){
  let list=COINS.map(c=>({c,a:st.sig[c.s],p:st.P[c.s]}));
  if(st.filter==='L')list=list.filter(x=>x.a&&x.a.dir>0);if(st.filter==='S')list=list.filter(x=>x.a&&x.a.dir<0);if(st.filter==='strong')list=list.filter(x=>x.a&&x.a.dir&&x.a.conf>=S.minConf);
  if(st.mode==='spot'&&st.filter!=='all')list=list.filter(x=>x.a&&x.a.dir>0);
  list.sort((x,y)=>((y.a&&y.a.dir?y.a.conf:0)-(x.a&&x.a.dir?x.a.conf:0)));
  const strong=COINS.filter(c=>{const a=st.sig[c.s];return a&&a.dir&&a.conf>=S.minConf&&(st.mode!=='spot'||a.dir>0)}).length;
  let h=`<h2>Сигнали</h2><p class="sub">Топ-30 монет · ${st.mode==='spot'?'Спот (тільки покупка)':'Ф\'ючерси'} · графік ${ST().lbl} · сильних: <b style="color:var(--tx)">${strong}</b></p>
  <div class="seg" style="margin-bottom:10px"><button class="${S.style==='calm'?'on':''}" data-act="style" data-arg="calm">🧘 Спокійний · 1 год</button><button class="${S.style==='active'?'on':''}" data-act="style" data-arg="active">⚡ Активний · 15 хв</button></div>
  <div class="chips">${[['all','Всі'],['strong','Сильні ≥'+S.minConf+'%'],['L','Лонг ↑'],['S','Шорт ↓']].map(([k,l])=>`<button class="chip ${st.filter===k?'on':''}" data-act="filter" data-arg="${k}">${l}</button>`).join('')}</div>`;
  if(st.src==='demo')h+=`<div class="banner amb" data-act="help" data-arg="demo">Демо-режим: ціни змодельовані й прискорені. Детальніше →</div>`;
  if(!list.length)h+=`<div class="empty">Зараз немає сигналів за цим фільтром.<br>Відсутність угоди теж рішення.</div>`;
  list.forEach(({c,a,p})=>{const ch=p?p.ch:0;
    h+=`<button class="coin" data-act="pick" data-arg="${c.s}">${cic(c.s)}<div class="cn"><b>${st.src==='live'?tsym(c.s):c.s}</b><small>${c.n}</small></div>
    <div class="cp"><div class="p">${p?fp(p.price):'—'}</div><div class="c ${ch>=0?'up':'dn'}">${pct(ch)}</div></div>
    <div class="sig">${sigBadge(a)}${a&&a.dir?`<div class="cbar"><b style="width:${a.conf}%;background:${confColor(a.conf)}"></b></div><div class="cf">${a.conf}%</div>`:''}</div></button>`});
  document.getElementById('v-signals').innerHTML=h;
}

/* ================== УГОДА ================== */

  if(!plan){h+=`<div class="card" style="margin-top:14px"><div class="empty">${st.mode==='spot'&&(st.override||a.dir)<0?'На споті можна заробити лише на рості. Сигнал зараз на падіння, тому чекаємо.':'Чіткого сигналу немає.<br>Обери напрямок вручну, лише якщо впевнений.'}</div></div>`;el.innerHTML=h;return}
  const t=today(),lim=bankNow()*S.dailyLoss/100,rr=(plan.pnlTP/plan.riskUsd);

  ${plan.tpMode==='one'?cell('Тейк-профіт',fp(plan.tp1),`<span class="up">${pct(plan.distPct*2)} · вся позиція</span>`,'up','tp'):

  ${cell('Розмір позиції',fu(plan.notional),`<span class="mu">${fq(plan.qty)} ${tsym(plan.sym)}</span>`,'','size')}

  ${cell('Комісія',fu(plan.feeTP),'<span class="mu">вхід + вихід</span>','','fee')}

  </div>

  if(plan.notes.length)h+=`<div class="banner amb">${plan.notes.join('<br>')}</div>`;
  if(a.conf<S.minConf)h+=`<div class="banner amb">Впевненість ${a.conf}% нижча за твій мінімум (${S.minConf}%). За правилами стратегії цю угоду варто пропустити.</div>`;
  if(t.pnl<=-lim)h+=`<div class="banner red">Денний ліміт збитку досягнуто. Стратегія забороняє нові угоди сьогодні.</div>`;

/* ================== ГРАФІК ================== */
let CH=null,cS,e21S,e200S,lines=[],chKey='',chLen=0;
function initChart(){
  if(CH||!window.LightweightCharts){if(!window.LightweightCharts)document.getElementById('chartBox').innerHTML='<div class="empty">Бібліотеку графіків не вдалося завантажити.</div>';return}
  CH=LightweightCharts.createChart(document.getElementById('chartBox'),{autoSize:true,layout:{background:{type:'solid',color:'transparent'},textColor:'#8b94a8',fontFamily:'JetBrains Mono',fontSize:11},
    grid:{vertLines:{color:'#1a2030'},horzLines:{color:'#1a2030'}},rightPriceScale:{borderColor:'#232b40'},timeScale:{borderColor:'#232b40',timeVisible:true},crosshair:{mode:0}});
  cS=CH.addCandlestickSeries({upColor:'#1fd286',downColor:'#ff4d6a',borderVisible:false,wickUpColor:'#1fd286',wickDownColor:'#ff4d6a'});
  e21S=CH.addLineSeries({color:'#8b6cff',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
  e200S=CH.addLineSeries({color:'#ffb547',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
}
function chartData(full){
  if(!CH)return;const k=getCandles(st.chartSym,st.chartTf);
  if(!k){if(st.src==='live')loadTf(st.chartSym,st.chartTf).then(()=>chartData(true));return}
  const key=st.chartSym+st.chartTf;const c=k.map(b=>b.c),e21=emaA(c,21),e200=emaA(c,200);
  if(full||key!==chKey||k.length!==chLen){
    const d=dec(k[k.length-1].c);const pf={type:'price',precision:d,minMove:Math.pow(10,-d)};
    cS.applyOptions({priceFormat:pf});e21S.applyOptions({priceFormat:pf});e200S.applyOptions({priceFormat:pf});
    cS.setData(k.map(b=>({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c})));
    e21S.setData(k.map((b,i)=>({time:b.t,value:e21[i]})));e200S.setData(k.length>=200?k.map((b,i)=>({time:b.t,value:e200[i]})).slice(199):[]);
    if(key!==chKey)CH.timeScale().fitContent();chKey=key;chLen=k.length;drawLines();
  }else{const b=k[k.length-1],i=k.length-1;cS.update({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c});e21S.update({time:b.t,value:e21[i]});if(k.length>=200)e200S.update({time:b.t,value:e200[i]})}
}
function drawLines(){
  lines.forEach(l=>cS.removePriceLine(l));lines=[];if(!st.showPlan)return;
  const open=J.find(t=>t.status==='open'&&t.sym===st.chartSym);let pl=open;
  if(!pl&&st.chartSym===st.sel){const cp=curPlan();pl=cp&&cp.plan}
  if(!pl)return;
  [[pl.entry,'#8b6cff','Вхід'],[pl.sl,'#ff4d6a','Стоп'],[pl.tp1,'#1fd286','Тейк 1'],[pl.tp2,'#1fd286','Тейк 2']].forEach(([p,c,t])=>lines.push(cS.createPriceLine({price:p,color:c,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:t})));
}
function renderChart(){
  const sel=document.getElementById('chartSym');sel.innerHTML=COINS.map(c=>`<option value="${c.s}" ${c.s===st.chartSym?'selected':''}>${c.s} · ${c.n}</option>`).join('');
  document.getElementById('tfChips').innerHTML=Object.keys(TF).map(t=>`<button class="chip ${st.chartTf===t?'on':''}" data-act="tf" data-arg="${t}">${t}</button>`).join('')+`<button class="chip ${st.showPlan?'on':''}" data-act="plan">Лінії плану</button>`;
  initChart();chartData(true);renderInd();
}
function renderInd(){
  const a=st.sig[st.chartSym];const el=document.getElementById('chartInd');if(!a){el.innerHTML='';return}
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b>Що кажуть індикатори (${ST().lbl})</b>${sigBadge(a)}</div>
  <div class="note" style="margin-bottom:6px"><span style="color:#8b6cff">━ EMA21</span> · <span style="color:#ffb547">━ EMA200</span> на графіку</div>
  ${a.ind.map(i=>{const v=i.vote,cls=v>0?'L':v<0?'S':'W';return `<div class="ind"><div class="dot badge ${cls}">${v>0?'↑':v<0?'↓':'·'}</div><div class="t"><b>${i.name}</b><small>${i.txt}</small></div><div class="val">${i.val}</div></div>`}).join('')}
  <button class="btn" data-act="pick" data-arg="${a.sym}">Розрахувати угоду по ${a.sym}</button></div>`;
}

/* ================== ЖУРНАЛ ================== */
function upnl(t){const p=st.P[t.sym];if(!p)return 0;return t.qty*(p.price-t.entry)*t.dir-t.feeIn}
function renderJournal(){
  const open=J.filter(t=>t.status==='open'),closed=closedT().sort((a,b)=>b.closedAt-a.closedAt);
  let h=`<h2>Журнал</h2><p class="sub">Відкритих: ${open.length} · закритих: ${closed.length}</p><button class="btn o" style="margin:0 0 12px" data-act="addManual">+ Додати угоду вручну</button>`;
  if(!J.length)h+=`<div class="empty">Тут з'являться твої угоди.<br>Записуй кожну, бо без журналу не видно помилок.</div>`;
  if(open.length)h+='<div class="lbl">Відкриті</div>';
  open.forEach(t=>{const u=upnl(t);
    h+=`<div class="tr"><div class="trh">${cic(t.sym)}<div><b>${t.sym}</b> <span class="badge ${t.dir>0?'L':'S'}">${t.dir>0?'ЛОНГ':'ШОРТ'}</span><div class="note">${t.mode==='spot'?'Спот':t.lev+'x'} · ${new Date(t.openedAt).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div>
    <div class="m"><div class="mono ${u>=0?'up':'dn'}" id="u-${t.id}" style="font-weight:700">${fu(u,1)}</div><div class="note">зараз</div></div></div>

function hMap(k,h,ms,hs){const m=[];let j=-1;for(let i=0;i<k.length;i++){const cl=k[i].t+ms;while(j+1<h.length&&h[j+1].t+hs<=cl)j++;m.push(j)}return m}
function btCoin(sym,k,h,ms,hs,o){
  const I=indic(k),HI=hIndic(h),mp=hMap(k,h,ms,hs),tr=[];let i=210;
  while(i<k.length-2){const hi=mp[i];if(hi<55){i++;continue}
    const a=scoreAt(I,HI,i,hi,sym);
    if(!a.dir||a.conf<o.minConf||(o.mode==='spot'&&a.dir<0)){i++;continue}
    const p=makePlan(a,a.dir,o.entryType,o.mode,o.bank,o.tpMode),d=a.dir;let fi=-1;
    if(o.entryType==='market')fi=i+1;else for(let j=i+1;j<=Math.min(i+o.expiry,k.length-1);j++){if(d>0?k[j].l<=p.entry:k[j].h>=p.entry){fi=j;break}}
    if(fi<0){i++;continue}
    let half=false,sl=p.sl,res=null,ej=fi;const end=Math.min(k.length-1,fi+o.hold);
    for(let j=fi;j<=end;j++){const b=k[j],hS=d>0?b.l<=sl:b.h>=sl,h1=d>0?b.h>=p.tp1:b.l<=p.tp1,h2=d>0?b.h>=p.tp2:b.l<=p.tp2;ej=j;
      if(hS){res=half?'be':'sl';break}
      if(j===fi&&o.entryType!=='market')continue;
      if(!half&&h1){half=true;sl=p.entry;if(h2){res='tp';break}continue}
      if(half&&h2){res='tp';break}}
    let pnl;
    if(res==='tp')pnl=p.pnlTP;else if(res==='sl')pnl=p.pnlSL;else if(res==='be')pnl=p.pnlBE;
    else{const x=k[ej].c;res='time';pnl=half?p.qty/2*(p.tp1-p.entry)*d+p.qty/2*(x-p.entry)*d-p.feeIn-p.qty/2*p.tp1*p.fmk-p.qty/2*x*p.ftk:p.qty*(x-p.entry)*d-p.feeIn-p.qty*x*p.ftk}

  }

}

  <div class="lbl">Інший режим тейку</div><div class="card"><div class="note">${b.alt.mode==='one'?'Один тейк (2R)':'Два тейки (1.5R + 2.5R)'}: <b class="${b.alt.tot>=0?'up':'dn'}">${fu(b.alt.tot,1)}</b> · вінрейт ${b.alt.wr.toFixed(0)}% · PF ${isFinite(b.alt.pf)?b.alt.pf.toFixed(2):'∞'} · просідання ${fu(-b.alt.dd)}</div>
  <div class="note" style="margin-top:6px;color:#c9cfdb">${b.alt.tot>b.tot?'👉 На цій історії інший режим кращий. Можна перемкнути його у вкладці «Угода».':'👉 Твій поточний режим кращий.'}</div></div>`;
  const bc=Object.entries(b.byCoin).sort((x,y)=>y[1]-x[1]);
  if(bc.length>3)h+=`<div class="lbl">Монети</div><div class="grid2"><div class="cell"><div class="l">Найкращі</div>${bc.slice(0,3).map(([s2,v])=>`<div class="mono" style="font-size:13px;margin-top:4px">${s2} <span class="${v>=0?'up':'dn'}">${fu(v,1)}</span></div>`).join('')}</div>
  <div class="cell"><div class="l">Найгірші</div>${bc.slice(-3).reverse().map(([s2,v])=>`<div class="mono" style="font-size:13px;margin-top:4px">${s2} <span class="${v>=0?'up':'dn'}">${fu(v,1)}</span></div>`).join('')}</div></div>`;
  return h;
}

function scanNotify(){const now=new Set(COINS.filter(c=>{const a=st.sig[c.s];return a&&a.dir&&a.conf>=S.minConf&&(st.mode!=='spot'||a.dir>0)}).map(c=>c.s));
  if(st.prevStrong){const nw=[...now].filter(s=>!st.prevStrong.has(s));if(nw.length)toast(nw)}st.prevStrong=now}
function toast(list){const a=st.sig[list[0]];let el=document.getElementById('toast');if(!el){el=document.createElement('button');el.id='toast';el.className='toast';document.body.appendChild(el)}
  el.dataset.act='pick';el.dataset.arg=a.sym;el.innerHTML=`🔔 Новий сигнал: <b>${a.sym} ${a.dir>0?'ЛОНГ ↑':'ШОРТ ↓'}</b> · ${a.conf}%${list.length>1?` · і ще ${list.length-1}`:''}`;
  el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),7000);
  try{if(window.Notification&&Notification.permission==='granted')new Notification('Signal Desk',{body:`${a.sym} ${a.dir>0?'ЛОНГ':'ШОРТ'} · ${a.conf}%`})}catch(e){}}

  if(e.target.id==='sheetBg'){closeSheet();return}

  if(a==='tab')setView(g);

  else if(a==='dir'){st.override=+g||null;renderTrade()}

    if(g==='1')S.onboarded=true;save('sd_settings',S);closeSheet();renderAll()}
  else if(a==='copyJ'){navigator.clipboard.writeText(JSON.stringify({S,J})).then(()=>{b.textContent='Скопійовано ✓'}).catch(()=>{const t=document.getElementById('impTxt');t.value=JSON.stringify({S,J});t.select();b.textContent='Виділено, скопіюй вручну'})}

});
